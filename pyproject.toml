[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bl4-forge"
version = "0.1.0.dev0"
description = "Local-first Borderlands 4 save and loadout editor: serial codec, save container, catalog search, loadout builder."
requires-python = ">=3.10"
dependencies = ["tomli>=2; python_version < '3.11'"]
license = { text = "AGPL-3.0-only" }

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
bl4forge = "bl4forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bl4forge.web" = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
